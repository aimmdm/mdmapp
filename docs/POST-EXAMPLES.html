<!-- ====================================================================
  CONTOH PENGGUNAAN DI POSTINGAN BLOGGER
  Buka postingan -> ubah mode editor ke "Tampilan HTML" -> tempel kode.
  Tool dimuat otomatis saat pengunjung menggulir mendekatinya.
  Tulis juga konten asli (cara pakai, FAQ, tips) minimal ~400 kata
  di atas atau bawah tool: itu yang membantu Google mengindeks halaman.
==================================================================== -->

<!-- 1. Kompres gambar -->
<div data-mdmg-tool="image-compress">
  <noscript>Aktifkan JavaScript untuk memakai tool ini.</noscript>
</div>

<!-- 2. Konversi format gambar -->
<div data-mdmg-tool="image-convert"></div>

<!-- 3. Perapi JSON -->
<div data-mdmg-tool="json-formatter"></div>

<!-- 4. Penghitung kata -->
<div data-mdmg-tool="word-counter"></div>

<!-- Aturan nama: huruf kecil, angka, dan tanda hubung. Nama harus sama
     dengan nama file di dist/tools/ (tanpa .js). -->
